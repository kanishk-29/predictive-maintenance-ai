<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Cell — Machine check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --ink: #f7f7f5;
      --muted: #c8c8c4;
      --amber: #e8c56b;
      --line: rgba(255, 255, 255, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, sans-serif;
      color: var(--ink);
      background: #000;
      letter-spacing: 0.01em;
    }
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 480px at 12% 0%, rgba(255, 255, 255, 0.07), transparent 60%),
        radial-gradient(700px 420px at 100% 80%, rgba(255, 255, 255, 0.05), transparent 55%),
        #000;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 32px;
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--amber);
      margin: 0 0 8px;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin: 0;
      color: #fff;
    }
    .sub {
      max-width: 36ch;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
      text-align: right;
    }
    .glass {
      background: rgba(12, 12, 12, 0.62);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .panel {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      border-radius: 28px;
      padding: 20px;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
      padding: 8px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #eee;
    }
    label span.unit {
      color: var(--amber);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    input, select {
      width: 100%;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      padding: 12px 14px;
      font: 500 16px/1.2 Outfit, sans-serif;
      outline: none;
    }
    select option { color: #111; background: #fff; }
    input:focus, select:focus {
      border-color: rgba(232, 197, 107, 0.95);
      box-shadow: 0 0 0 3px rgba(232, 197, 107, 0.25);
    }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 6px;
    }
    button {
      appearance: none;
      cursor: pointer;
      color: #111;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: #e8c56b;
    }
    button:hover { background: #f0d48a; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .hint {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .side {
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }
    .side h2 {
      font-family: Syne, sans-serif;
      font-size: 18px;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
      color: #fff;
    }
    svg.mill { width: 100%; height: auto; display: block; }
    #result {
      margin-top: auto;
      border-radius: 16px;
      padding: 18px 16px;
      min-height: 108px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.45);
    }
    #result .status {
      font-family: Syne, sans-serif;
      font-size: 26px;
      letter-spacing: -0.03em;
      margin: 0 0 6px;
      color: #fff;
    }
    #result .prob {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      color: #eee;
    }
    #result.wait .status,
    #result.wait .prob { color: #ddd; }
    #result.healthy {
      background: #1b7a45;
      border-color: #3dce7a;
    }
    #result.alert {
      background: #9a2a28;
      border-color: #f0716b;
    }
    #result.error {
      background: #5c4a14;
      border-color: #e8c56b;
    }
    #result.healthy .status,
    #result.healthy .prob,
    #result.alert .status,
    #result.alert .prob,
    #result.error .status,
    #result.error .prob { color: #fff; }
    @media (max-width: 800px) {
      header { flex-direction: column; align-items: flex-start; }
      .sub { text-align: left; }
      .panel, form { grid-template-columns: 1fr; }
      .side { min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <div>
        <p class="kicker">Helix Cell 04 · predictive maintenance</p>
        <h1>Check the machine<br>before it stops.</h1>
      </div>
      <p class="sub">Six readings from the last cycle. One call to the model in app.py. Green means run. Red means book the bay.</p>
    </header>
    <div class="panel glass">
      <form id="machine-form" onsubmit="return false;">
        <label>
          Type <span class="unit">L / M / H</span>
          <select id="type" name="type">
            <option value="0">L — low</option>
            <option value="1" selected>M — medium</option>
            <option value="2">H — high</option>
          </select>
        </label>
        <label>
          Air temperature <span class="unit">K</span>
          <input id="air" name="air" type="number" step="0.1" value="298" min="290" max="310">
        </label>
        <label>
          Process temperature <span class="unit">K</span>
          <input id="proc" name="proc" type="number" step="0.1" value="308" min="300" max="320">
        </label>
        <label>
          Rotational speed <span class="unit">rpm</span>
          <input id="rpm" name="rpm" type="number" step="1" value="1500" min="1000" max="3000">
        </label>
        <label>
          Torque <span class="unit">Nm</span>
          <input id="torque" name="torque" type="number" step="0.1" value="40" min="1" max="100">
        </label>
        <label>
          Tool wear <span class="unit">min</span>
          <input id="wear" name="wear" type="number" step="1" value="50" min="0" max="300">
        </label>
        <div class="actions">
          <button type="button" id="check-btn" onclick="check()">Check Machine</button>
          <span class="hint">POST /predict</span>
        </div>
      </form>
      <aside class="side glass">
        <h2>Spindle status</h2>
        <svg class="mill" viewBox="0 0 320 180" role="img" aria-label="Stylised milling spindle">
          <rect x="24" y="128" width="272" height="18" rx="4" fill="#1a1a1a" stroke="#444"/>
          <rect x="138" y="28" width="44" height="78" rx="6" fill="#2a2a2a" stroke="#888"/>
          <rect x="148" y="102" width="24" height="28" fill="#c4a15a"/>
          <circle cx="160" cy="36" r="10" fill="#e8c56b"/>
          <path d="M70 128 L110 96 H210 L250 128" fill="none" stroke="#aaa" stroke-width="2"/>
          <text x="24" y="24" fill="#ddd" font-family="IBM Plex Mono, monospace" font-size="11">CELL 04</text>
        </svg>
        <div id="result" class="wait" role="status" aria-live="polite">
          <p class="status">Waiting</p>
          <p class="prob">Probability will show here after Check Machine.</p>
        </div>
      </aside>
    </div>
  </div>
  <script>
    const API_URL = "http://127.0.0.1:8000/predict";

    function showProbability(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "Probability unavailable";
      const pct = n <= 1 ? n * 100 : n;
      return "Probability " + pct.toFixed(1) + "%";
    }

    function show(box, cls, status, detail) {
      box.className = cls;
      box.innerHTML = '<p class="status">' + status + '</p><p class="prob">' + detail + '</p>';
    }

    async function check() {
      const box = document.getElementById("result");
      const btn = document.getElementById("check-btn");
      const body = {
        type: Number(document.getElementById("type").value),
        air_temp: Number(document.getElementById("air").value),
        process_temp: Number(document.getElementById("proc").value),
        rpm: Number(document.getElementById("rpm").value),
        torque: Number(document.getElementById("torque").value),
        tool_wear: Number(document.getElementById("wear").value)
      };
      btn.disabled = true;
      show(box, "wait", "Checking", "Asking the model…");
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (res.status === 422) {
          show(box, "error", "Invalid reading", "A value is outside the allowed range. Check the inputs.");
          return;
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const prob = showProbability(data.failure_probability);
        if (data.alert) {
          show(box, "alert", "Alert: schedule maintenance", prob);
        } else {
          show(box, "healthy", "Healthy", prob);
        }
      } catch (err) {
        show(box, "error", "Cannot reach model", "Is the server running? Start uvicorn and try again.");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
